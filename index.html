<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSN Auto Streak Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            max-width: 450px;
            width: 100%;
        }
        .streak-number {
            font-size: 50px;
            color: #4CAF50;
            margin: 15px 0;
        }
        .status-box {
            margin: 15px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            font-size: 16px;
            text-align: right;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            box-sizing: border-box;
        }
        input {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
        }
        button {
            background-color: #0070d1;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #005fb8;
        }
        .message {
            margin-top: 15px;
            font-size: 15px;
            color: #00bcd4;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎮 PSN Auto Streak</h1>
        
        <!-- صفحة تسجيل الدخول بكود الـ PSN (الذي يبدأ بـ n) -->
        <div id="auth-section">
            <p style="font-size: 14px; color: #aaa;">أدخل كود جلسة البلاي ستيشن الخاص بك (يبدأ بـ n...):</p>
            <input type="text" id="psn-token-input" placeholder="الصق الكود هنا...">
            <button onclick="loginPSN()">دخول تلقائي</button>
        </div>

        <!-- لوحة العداد التلقائي (تظهر فور الدخول) -->
        <div id="tracker-section" class="hidden">
            <div class="streak-number" id="streak-count">0 دقيقة</div>
            
            <div class="status-box">
                <p id="youssef-status">👤 يوسف: جارٍ التحقق من الـ PSN...</p>
                <p id="friend-status">👤 صديقك: غير متصل 🔴</p>
            </div>

            <div class="message" id="congrats-msg">جارٍ مزامنة الجلسة...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://navofdgrmdigluaucxvx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_leq-S1NSvUZ8naYj65aMbg_OMcj6Tbi';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = function() {
            // لو مسجل دخول قبل كده بنفس الموبايل/الجهاز، يدخل لوحده فورا من غير ما يكتب الكود تاني
            if (localStorage.getItem('psn_n_token')) {
                showTracker();
            }
        };

        function loginPSN() {
            const token = document.getElementById('psn-token-input').value.trim();
            if (token.startsWith('n') || token.length > 10) {
                localStorage.setItem('psn_n_token', token);
                showTracker();
            } else {
                alert('الرجاء إدخال كود صالح يبدأ بحرف n');
            }
        }

        function showTracker() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('tracker-section').classList.remove('hidden');
            
            // بدء المزامنة التلقائية فوراً
            syncLoop();
            // زيادة الستريك تلقائياً كل دقيقة لو الطرفين متصلين
            setInterval(autoIncrementStreak, 60000); 
        }

        async function syncLoop() {
            updateStatusOnline(true);
            setInterval(fetchAndUpdateUI, 3000); // تحديث الشاشة كل 3 ثواني لمتابعة صديقك لحظياً
            fetchAndUpdateUI();
        }

        async function updateStatusOnline(status) {
            await supabase
                .from('streak_data')
                .update({ youssef_checked: status })
                .eq('id', 1);
        }

        async function fetchAndUpdateUI() {
            const { data, error } = await supabase
                .from('streak_data')
                .select('*')
                .eq('id', 1)
                .single();

            if (error) return;

            document.getElementById('streak-count').innerText = data.current_streak + " دقيقة";
            
            document.getElementById('youssef-status').innerText = data.youssef_checked ? '👤 يوسف: متصل عبر PSN 🟢' : '👤 يوسف: غير متصل 🔴';
            document.getElementById('friend-status').innerText = data.friend_checked ? '👤 صديقك: متصل عبر PSN 🟢' : '👤 صديقك: غير متصل 🔴';

            const msg = document.getElementById('congrats-msg');
            if (data.current_streak >= 5000) {
                msg.innerText = "🔥 أسطوريون! تجاوزتم 5000 دقيقة لعب جماعي معاً!";
            } else if (data.youssef_checked && data.friend_checked) {
                msg.innerText = "⭐ أنتم الاثنين اونلاين الآن! العداد يعد الدقائق تلقائياً...";
            } else {
                msg.innerText = "⏳ في انتظار اتصال الطرفين لتفعيل عداد الدقائق التلقائي.";
            }
        }

        async function autoIncrementStreak() {
            const { data, error } = await supabase
                .from('streak_data')
                .select('*')
                .eq('id', 1)
                .single();

            if (error) return;

            // لو يوسف وصديقه متصلين مع بعض في نفس الدقيقة، زود الستريك تلقائياً بدقيقة واحدة
            if (data.youssef_checked && data.friend_checked) {
                let newStreak = data.current_streak + 1;
                await supabase
                    .from('streak_data')
                    .update({ current_streak: newStreak })
                    .eq('id', 1);
            }
        }
    </script>

</body>
</html>
