<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Streak Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .streak-number {
            font-size: 48px;
            color: #4CAF50;
            margin: 10px 0;
        }
        .status {
            font-size: 18px;
            color: #00bcd4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎮 Gamer Streak Tracker</h1>
        <div class="status" id="status-text">جاري التحميل...</div>
        <div class="streak-number" id="streak-count">-</div>
        <p id="update-text"></p>
    </div>

    <script>
        async function loadStreakData() {
            try {
                // سحب البيانات مباشرة من ملف data.json اللي في نفس المشروع على جيت هب
                const response = await fetch('data.json?' + new Date().getTime()); // لمنع التخزين المؤقت (Cache)
                const data = await response.json();
                
                document.getElementById('streak-count').innerText = data.current_streak + " يوم";
                document.getElementById('status-text').innerText = data.online ? "🟢 متصل الآن" : "🔴 غير متصل";
                document.getElementById('update-text').innerText = "آخر تحديث: " + data.last_updated;
            } catch (error) {
                console.error("خطأ في تحميل البيانات:", error);
                document.getElementById('status-text').innerText = "⚠️ فشل تحميل البيانات";
            }
        }

        // تشغيل الدالة أول ما الصفحة تفتح
        loadStreakData();
    </script>

</body>
</html>
